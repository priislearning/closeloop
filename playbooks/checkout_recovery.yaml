playbook_id: checkout_recovery
name: Friction & Intent Aware Checkout Recovery
category: checkout_recovery
description: >
  Recovers abandoned checkouts by separating UX friction / OTP drops from price hesitation.
  Implements hard stopping rules for low-intent sessions to avoid brand fatigue.

eligible_root_causes:
  - CHECKOUT_FRICTION
  - PRICE_HESITATION
  - NO_INTENT

constraints:
  min_trust_score: 0.1
  max_contact_attempts_allowed: 2
  cooldown_hours: 6
  quiet_hours:
    enabled: true
    start_hour: 9    # 09:00 AM local time
    end_hour: 20     # 08:00 PM local time
  circuit_breaker:
    category: checkout_recovery
    max_failure_rate: 0.20
    max_opt_out_rate: 0.08
    rolling_window_size: 20

fatigue_scoring:
  whatsapp_fatigue: 1.0
  sms_fatigue: 1.5
  email_fatigue: 0.5
  voice_fatigue: 4.0

escalation_steps:
  - step: 1
    root_cause_match: CHECKOUT_FRICTION
    action_type: friction_assist
    channel: whatsapp
    delay_minutes: 10
    description: "Send prefilled 1-click checkout recovery link bypassing the broken OTP screen"
    template: "Hey {customer_name}! Noticed you faced an issue completing your INR {amount} order. Click here to complete checkout in 1-tap: {recovery_url}"
    requires_customer_interaction: true

  - step: 1
    root_cause_match: PRICE_HESITATION
    action_type: limited_coupon_nudge
    channel: whatsapp
    delay_minutes: 30
    description: "Send personalized 5% incentive valid for next 2 hours"
    template: "Hi {customer_name}, still thinking about your cart? Here is an exclusive 5% code 'COMPLETE5' for the next 2 hours: {recovery_url}"
    requires_customer_interaction: true

  - step: 1
    root_cause_match: NO_INTENT
    action_type: stop_no_contact
    channel: none
    delay_minutes: 0
    description: "STOP RULE TRIGGERED: Window shopping session detected. Zero messages dispatched."
    template: "NO_MESSAGE_DISPATCHED"
    requires_customer_interaction: false
